<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papel & Afeto — Papelaria Personalizada</title>
<meta name="description" content="Cadernos, agendas, cartões, convites e kits de presente personalizados, com prévia ao vivo e prazo de produção confirmado antes da compra.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Identidade visual "Paleta 03 — minimalismo delicado", definida pela Yara (WCAG 2.2 conferido) */
:root{
  --bg:#F7F4EF; --surface:#FFFFFF; --card:#E9D9D0; --border:#8F7865; --text:#302A26; --muted:#6B5D53; --faint:#948879;
  --accent:#596747; --accent-text:#F7F4EF; --accent2:#B87579;
  --danger:#9E303D; --danger-bg:#F6E3E5; --danger-text:#9E303D;
  --success:#596747; --success-bg:#E8EBE1; --success-text:#302A26; --chip-bg:#F1E0DD;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--text);margin:0}
h1{font-size:36px;font-weight:700;line-height:1.15}
h2{font-size:28px;font-weight:600;line-height:1.2}
h3{font-size:20px;font-weight:600;line-height:1.3}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:7px}
.logo img{height:28px;width:auto;display:block}
.nav{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:500}
.nav span{cursor:pointer;padding:9px 6px;display:inline-flex;align-items:center}
.nav span.on{color:var(--accent);font-weight:700}
main{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.search input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);flex:1;font-family:inherit;padding-block:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:12px 16px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:8px 12px;font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgph{background:var(--chip-bg);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:22px}
.pcard{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:500;cursor:pointer}
.price{font-weight:700;font-size:12px}
.product-grid{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.alert{border:1.5px solid var(--danger);border-radius:10px;padding:12px;font-size:12px;background:var(--danger-bg);color:var(--danger-text);display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.alert.ok{border-color:var(--success);background:var(--success-bg);color:var(--success-text)}
.field{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:11px 12px;font-size:13px;color:var(--text);width:100%;font-family:inherit}
.field.err{border-color:var(--danger);background:var(--danger-bg)}
textarea.field{resize:vertical;min-height:70px;line-height:1.5}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:11.5px;cursor:pointer;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--border)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--text)}
.preview{border-radius:10px;padding:22px 16px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1.6;border:1px solid var(--border)}
.counter{font-size:12px;text-align:right;color:var(--muted);font-weight:600}
.counter.err{color:var(--danger)}
.errmsg{font-size:11px;color:var(--danger);font-weight:600;display:flex;gap:4px;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer}
.chk .b{width:14px;height:14px;border:1.5px solid var(--border);border-radius:4px;flex:none}
.chk.on .b{background:var(--text);border-color:var(--text)}
.filters{display:flex;flex-direction:column;gap:3px}
.filtersgrid{display:flex;gap:16px;flex-wrap:wrap}
.filtersgrid>div{flex:1;min-width:120px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px 20px}
.icon64{width:60px;height:60px;border-radius:50%;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:26px}
.rowline{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.rowline.tot{font-weight:700;font-size:14px;border-top:1px solid var(--border);margin-top:4px;padding-top:8px}
.cartitem{display:flex;gap:10px;align-items:center}
.cartitem .imgph{width:52px;height:52px;flex:none}
.cartitem .meta{flex:1;font-size:12px}
.cartitem .meta .nm{font-weight:600;font-size:12.5px}
.cartitem .meta .sub{color:var(--muted);font-size:10.5px}
.linkbtn{color:var(--accent);font-size:11px;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
.tabs{display:flex;gap:4px;background:var(--chip-bg);border-radius:10px;padding:3px}
.tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--text)}
.stepper{display:flex;align-items:center;gap:0;margin-top:8px}
.stepper .dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex:none}
.stepper .dot.done{background:var(--success)}
.stepper .ln{flex:1;height:2px;background:var(--border)}
.stepper .ln.done{background:var(--success)}
.steplabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.table{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12px}
.row{display:flex;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.acc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12.5px}
.acc .q{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:500}
.acc .a{padding:0 14px 13px;color:var(--muted);font-size:11.5px;line-height:1.5}
.footer{padding:18px 16px max(18px,env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--muted);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.footer a{text-decoration:underline;cursor:pointer;color:var(--accent);display:inline-block;padding:4px}
.back{font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
.heart{cursor:pointer;font-size:16px}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const PRODUCTS = [
  {id:'cad1', name:'Caderno pautado A5', cat:'cadernos', catLabel:'Cadernos', price:24.90, lead:2, icon:'📓', img:'assets/products/caderno.jpg', personal:{type:'nome', label:'Nome ou iniciais na capa', maxLen:30}, desc:'Caderno A5 capa dura, 120 folhas pautadas, com a sua personalização gravada na capa.'},
  {id:'pln1', name:'Planner semanal', cat:'planners', catLabel:'Planners', price:39.90, lead:2, icon:'🗓️', img:'assets/products/agenda.jpg', personal:{type:'nome', label:'Nome na capa', maxLen:30}, desc:'Planner semanal perpétuo, miolo offset 90g, capa com nome personalizado.'},
  {id:'crt1', name:'Cartão agradecimento', cat:'cartoes', catLabel:'Cartões', price:4.90, lead:3, icon:'💌', img:'assets/products/cartao.jpg', personal:{type:'mensagem', label:'Mensagem personalizada', maxLen:120}, desc:'Cartão duplo em papel reciclado, com a mensagem que você escolher no miolo.'},
  {id:'cnv1', name:'Convite casamento floral', cat:'convites', catLabel:'Convites', price:6.90, lead:4, icon:'🤍', img:'assets/products/convite.jpg', personal:{type:'mensagem', label:'Mensagem personalizada', maxLen:200, needsDate:true}, desc:'Convite floral em papel perolado, com nomes, data e texto do seu jeito.'},
  {id:'kit1', name:'Kit presente chá de bebê', cat:'kits', catLabel:'Kits de presente', price:54.90, lead:3, icon:'🎁', img:'assets/products/kit.jpg', personal:{type:'nome', label:'Nome do bebê no kit', maxLen:24}, desc:'Kit com lembrancinhas, tag e embalagem personalizada pro chá de bebê.'},
  {id:'ade1', name:'Adesivo em folha', cat:'adesivos', catLabel:'Adesivos', price:0.48, lead:2, icon:'⭐', img:'assets/products/adesivo.jpg', personal:null, desc:'Folha de adesivos vinil, acabamento brilho ou mate, modelos prontos.'},
  {id:'cnc1', name:'Caneca personalizada', cat:'canecas', catLabel:'Canecas', price:29.90, lead:2, icon:'☕', img:'assets/products/caneca.jpg', personal:{type:'nome', label:'Nome ou frase na caneca', maxLen:40}, desc:'Caneca de cerâmica 325ml, estampa permanente com o nome ou frase que você quiser.'},
  {id:'blc1', name:'Bloquinho personalizado', cat:'blocos', catLabel:'Blocos', price:14.90, lead:2, icon:'📝', img:'assets/products/bloquinho.jpg', personal:{type:'nome', label:'Nome na capa', maxLen:30}, desc:'Bloquinho de anotações com 80 folhas e capa personalizada com o seu nome.'},
  {id:'cnt1', name:'Caneta personalizada', cat:'canetas', catLabel:'Canetas', price:12.90, lead:2, icon:'🖊️', img:'assets/products/caneta.jpg', personal:{type:'nome', label:'Nome ou iniciais na caneta', maxLen:25}, desc:'Caneta esferográfica metálica, gravação a laser com nome ou iniciais.'},
];
const CATS = [
  {k:'cadernos', label:'Cadernos', icon:'📓'},
  {k:'planners', label:'Agendas', icon:'🗓️'},
  {k:'cartoes', label:'Cartões', icon:'💌'},
  {k:'convites', label:'Convites', icon:'🤍'},
  {k:'kits', label:'Kits', icon:'🎁'},
  {k:'adesivos', label:'Adesivos', icon:'⭐'},
  {k:'canecas', label:'Canecas', icon:'☕'},
  {k:'blocos', label:'Blocos', icon:'📝'},
  {k:'canetas', label:'Canetas', icon:'🖊️'},
];
const TYPO = [
  {k:'script', label:'Script', font:"'Brush Script MT',cursive"},
  {k:'serifada', label:'Serifada', font:"Georgia,'Times New Roman',serif"},
  {k:'moderna', label:'Moderna', font:"'Inter',sans-serif"},
];
const PAPER_COLORS = ['#F7F4EF','#F3E7DC','#E9E3F5','#DCE8DD'];
const INK_COLORS = ['#1F1E1C','#8A1F19','#1E5A38','#5B4A8A'];

function fmt(n){ return 'R$ ' + n.toFixed(2).replace('.',','); }
function addBizDays(date, days){
  let d = new Date(date);
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    if(d.getDay() !== 0 && d.getDay() !== 6) added++;
  }
  return d;
}
function fmtDate(d){ return d.toLocaleDateString('pt-BR'); }
function parseDateInput(v){
  if(!v) return null;
  const [y,m,day] = v.split('-').map(Number);
  return new Date(y, m-1, day);
}

const state = {
  view: 'home',
  query: '',
  catFilter: new Set(),
  prazoFilter: new Set(),
  currentProductId: null,
  cart: [],
  orders: [
    {id:'48195', items:'Caderno pautado A5', status:3, date:'28/10/2026'},
    {id:'48210', items:'Convite casamento floral', status:1, date:'03/11/2026'},
  ],
  favorites: new Set(['cnc1','pln1']),
  accountTab: 'pedidos',
  openFaq: null,
  openPolitica: false,
};

function newDraft(){
  return {text:'', typography:'serifada', paperColor:PAPER_COLORS[0], inkColor:INK_COLORS[0], eventDate:''};
}

function nav(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  window.scrollTo(0,0);
  render();
}

function productById(id){ return PRODUCTS.find(p=>p.id===id); }

function filteredProducts(){
  return PRODUCTS.filter(p=>{
    if(state.query){
      const q = state.query.toLowerCase();
      if(!p.name.toLowerCase().includes(q) && !p.catLabel.toLowerCase().includes(q)) return false;
    }
    if(state.catFilter.size && !state.catFilter.has(p.cat)) return false;
    if(state.prazoFilter.size){
      let ok = false;
      state.prazoFilter.forEach(maxD=>{ if(p.lead <= maxD) ok = true; });
      if(!ok) return false;
    }
    return true;
  });
}

function cartSummary(){
  const subtotal = state.cart.reduce((s,i)=>s+i.price,0);
  const frete = state.cart.length===0 ? 0 : (subtotal >= 100 ? 0 : 12.90);
  const total = subtotal + frete;
  const maxLead = state.cart.length ? Math.max(...state.cart.map(i=>i.lead)) : 0;
  const arrival = state.cart.length ? addBizDays(new Date(), maxLead) : null;
  return {subtotal, frete, total, maxLead, arrival};
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function imgph(src, icon, extraStyle){
  if(src) return `<div class="imgph" style="${extraStyle||''}background-image:url('${src}');background-size:cover;background-position:center"></div>`;
  return `<div class="imgph" style="${extraStyle||''}">${icon}</div>`;
}

// ---------- Renderers ----------

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="logo" data-go="home" tabindex="0" role="button" aria-label="Página inicial"><img src="assets/logo-icon.png" alt="">Papel &amp; Afeto</div>
    <div class="nav">
      <span class="${state.view==='catalog'?'on':''}" data-go="catalog" tabindex="0" role="link">Catálogo</span>
      <span class="${state.view==='account'?'on':''}" data-go="account" tabindex="0" role="link">Conta</span>
      <span class="${state.view==='cart'?'on':''}" data-go="cart" tabindex="0" role="link">Carrinho (${state.cart.length})</span>
    </div>
  </div>`;
}

function renderFooter(){
  return `<div class="footer">
    <a data-go="institutional" tabindex="0" role="button">Prazos de produção, trocas e perguntas frequentes</a>
    <a href="case.html">Ver case study deste projeto</a>
  </div>`;
}

function renderSearch(placeholder){
  return `<div class="search">🔍 <input id="searchInput" placeholder="${placeholder}" value="${esc(state.query)}"></div>`;
}

function renderHome(){
  const bestsellers = PRODUCTS.slice(0,3);
  return `
  ${renderSearch('Buscar cadernos, convites, cartões...')}
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h1>Papelaria que carrega<br>o seu recado</h1>
    <div style="font-size:16px;color:var(--muted)">Personalize com prévia ao vivo e saiba o prazo de entrega antes de comprar.</div>
    <button class="btn primary" style="width:fit-content" data-go="catalog">Ver catálogo</button>
  </div>
  <div class="label">Categorias</div>
  <div class="grid4">
    ${CATS.filter(c=>['cadernos','planners','cartoes','convites','canecas','blocos','canetas'].includes(c.k)).map(c=>`
      <div class="pcard" data-cat="${c.k}" tabindex="0" role="button" aria-label="Categoria ${c.label}">
        <div class="imgph" style="height:58px">${c.icon}</div>${c.label}
      </div>`).join('')}
  </div>
  <div class="label">Mais vendidos</div>
  <div class="grid3">
    ${bestsellers.map(p=>`
      <div class="pcard" data-product="${p.id}" tabindex="0" role="button" aria-label="${p.name}, ${fmt(p.price)} por unidade">
        ${imgph(p.img, p.icon, 'height:56px;')}${p.name}<div class="price">${fmt(p.price)}/un</div>
      </div>`).join('')}
  </div>`;
}

function renderCatalog(){
  const list = filteredProducts();
  const noQueryMatch = state.query && list.length===0;
  return `
  ${renderSearch('Buscar cadernos, convites, cartões...')}
  <div style="display:flex;gap:12px;align-items:flex-start">
    <div class="card filters" style="width:112px;flex:none;padding:12px">
      <div class="label" style="margin-bottom:6px">Categoria</div>
      ${CATS.map(c=>`<div class="chk ${state.catFilter.has(c.k)?'on':''}" data-togglecat="${c.k}" tabindex="0" role="checkbox" aria-checked="${state.catFilter.has(c.k)}"><div class="b"></div>${c.label}</div>`).join('')}
      <div class="label" style="margin-top:10px;margin-bottom:6px">Prazo</div>
      ${[3,7,15].map(d=>`<div class="chk ${state.prazoFilter.has(d)?'on':''}" data-toggleprazo="${d}" tabindex="0" role="checkbox" aria-checked="${state.prazoFilter.has(d)}"><div class="b"></div>Até ${d} dias</div>`).join('')}
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px">
      ${noQueryMatch ? `
        <div class="empty" style="padding:10px 4px">
          <div class="icon64">🔍</div>
          <div style="font-size:14px;font-weight:700">Nenhum resultado pra "${esc(state.query)}"</div>
          <div style="font-size:11.5px;color:var(--muted);max-width:220px">Tente um termo mais simples, ou explore as categorias ao lado.</div>
          <button class="btn primary sm" data-clearsearch="1">Ver todas as categorias</button>
        </div>
      ` : `
        <div class="label">${list.length} produto${list.length===1?'':'s'} · preço sempre por unidade</div>
        <div class="grid2 product-grid">
          ${list.map(p=>`
            <div class="pcard" data-product="${p.id}" tabindex="0" role="button" aria-label="${p.name}, ${fmt(p.price)} por unidade">
              ${imgph(p.img, p.icon, 'height:56px;')}${p.name}<div class="price">${fmt(p.price)}/un</div>
            </div>`).join('') || `<div style="font-size:12px;color:var(--muted);padding:8px">Nenhum produto nesse filtro ainda.</div>`}
        </div>
      `}
    </div>
  </div>`;
}

function renderProduct(){
  const p = productById(state.currentProductId);
  if(!p) return renderCatalog();
  return `
  <div class="back" data-go="catalog" tabindex="0" role="button">← Voltar ao catálogo</div>
  ${imgph(p.img, p.icon, 'height:180px;font-size:48px;')}
  <div>
    <div class="label">${p.catLabel}</div>
    <h3 style="margin-top:4px">${p.name}</h3>
    <div class="price" style="font-size:16px;margin-top:4px">${fmt(p.price)} <span style="font-weight:400;color:var(--muted);font-size:11px">/un</span></div>
  </div>
  <div style="font-size:16px;color:var(--muted);line-height:1.6">${p.desc}</div>
  <div class="card" style="display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600">⏱ Prazo de produção: ${p.lead} dias úteis + frete</div>
  ${p.personal
    ? `<button class="btn primary block" data-personalize="${p.id}">Personalizar este produto</button>`
    : `<button class="btn primary block" data-addplain="${p.id}">Adicionar ao carrinho</button>`
  }
  <button class="btn block" data-favtoggle="${p.id}">${state.favorites.has(p.id) ? '♥ Remover dos favoritos' : '♡ Salvar nos favoritos'}</button>`;
}

function renderPersonalize(){
  const p = productById(state.currentProductId);
  if(!p || !p.draft) return renderProduct();
  const d = p.draft;
  const maxLen = p.personal.maxLen;
  const over = maxLen && d.text.length > maxLen;
  const typo = TYPO.find(t=>t.k===d.typography);

  let prazoBox = '';
  let prazoBlocking = false;
  if(p.personal.needsDate){
    const minArrival = addBizDays(new Date(), p.lead);
    const eventDate = parseDateInput(d.eventDate);
    if(!d.eventDate){
      prazoBox = `<div class="card" style="font-size:12px;color:var(--muted)">Informe a data do evento pra confirmarmos o prazo de entrega.</div>`;
    } else if(eventDate < minArrival){
      prazoBlocking = true;
      prazoBox = `<div class="alert">⚠ <span><b>Não dá tempo</b> — esse produto leva ${p.lead} dias úteis pra ficar pronto. A entrega mais rápida possível seria <b>${fmtDate(minArrival)}</b>, depois da data que você escolheu.<br><br>Quer escolher outra data ou ver produtos com entrega mais rápida?</span></div>
        <button class="btn sm" data-go="catalog" data-prazofast="1">Ver produtos com entrega expressa</button>
        <button class="btn sm" data-cleardate="1">Escolher outra data</button>`;
    } else {
      prazoBox = `<div class="alert ok">✓ <span>Confirmamos entrega até <b>${fmtDate(minArrival)}</b> — a tempo do seu evento em ${fmtDate(eventDate)}.</span></div>`;
    }
  }

  const canAdd = !over && !prazoBlocking && (!p.personal.needsDate || d.eventDate);

  return `
  <div class="back" data-go="product" tabindex="0" role="button">← Voltar ao produto</div>
  <h2>Personalizar: ${p.name}</h2>
  <div class="preview" style="background:${d.paperColor};color:${d.inkColor};font-family:${typo.font}">
    ${esc(d.text) || '<span style="opacity:.4">Sua prévia aparece aqui</span>'}
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">${p.personal.label}</div>
    ${p.personal.type==='mensagem'
      ? `<textarea class="field ${over?'err':''}" id="draftText" placeholder="Escreva aqui...">${esc(d.text)}</textarea>`
      : `<input class="field ${over?'err':''}" id="draftText" placeholder="Escreva aqui..." value="${esc(d.text)}">`
    }
    ${maxLen ? `<div class="counter ${over?'err':''}">${d.text.length} / ${maxLen} caracteres</div>` : ''}
    ${over ? `<div class="errmsg">⚠ Esse texto é longo demais. Reduza em ${d.text.length-maxLen} caracteres pra continuar.</div>` : ''}
  </div>
  ${p.personal.needsDate ? `
    <div>
      <div class="label" style="margin-bottom:6px">Data do evento</div>
      <input type="date" class="field" id="draftDate" value="${d.eventDate}">
    </div>` : ''}
  <div>
    <div class="label" style="margin-bottom:6px">Tipografia</div>
    <div class="chiprow">${TYPO.map(t=>`<div class="chip ${t.k===d.typography?'on':''}" data-typo="${t.k}" tabindex="0" role="radio" aria-checked="${t.k===d.typography}">${t.label}</div>`).join('')}</div>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Cor do papel</div>
    <div class="swrow">${PAPER_COLORS.map(c=>`<div class="sw ${c===d.paperColor?'on':''}" style="background:${c}" data-paper="${c}" tabindex="0" role="radio" aria-checked="${c===d.paperColor}" aria-label="Cor do papel ${c}"></div>`).join('')}</div>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Cor da tipografia</div>
    <div class="swrow">${INK_COLORS.map(c=>`<div class="sw ${c===d.inkColor?'on':''}" style="background:${c}" data-ink="${c}" tabindex="0" role="radio" aria-checked="${c===d.inkColor}" aria-label="Cor da tipografia ${c}"></div>`).join('')}</div>
  </div>
  ${prazoBox}
  <button class="btn primary block" data-addpersonalized="${p.id}" ${canAdd?'':'disabled'}>Adicionar ao carrinho</button>`;
}

function renderCart(){
  if(state.cart.length===0){
    return `
    <div class="empty">
      <div class="icon64">🛍️</div>
      <h3>Seu carrinho está vazio</h3>
      <div style="font-size:12px;color:var(--muted);max-width:240px">As peças personalizadas que você adicionar aparecem aqui.</div>
      <button class="btn primary sm" data-go="catalog">Explorar catálogo</button>
    </div>`;
  }
  const s = cartSummary();
  return `
  <h2>Seu carrinho</h2>
  <div style="display:flex;flex-direction:column;gap:10px">
    ${state.cart.map((item,idx)=>`
      <div class="card cartitem">
        ${imgph(item.img, item.icon, '')}
        <div class="meta">
          <div class="nm">${item.name}</div>
          <div class="sub">${item.sub || 'Sem personalização'}</div>
        </div>
        <div style="text-align:right">
          <div class="price">${fmt(item.price)}</div>
          <button class="linkbtn" data-removecart="${idx}">remover</button>
        </div>
      </div>`).join('')}
  </div>
  <div class="card" style="font-size:12.5px">⏱ Prazo consolidado do pedido: entrega até <b>${fmtDate(s.arrival)}</b> (considerando a peça mais demorada, ${s.maxLead} dias úteis)</div>
  <div class="card">
    <div class="rowline"><span>Subtotal</span><span>${fmt(s.subtotal)}</span></div>
    <div class="rowline"><span>Frete</span><span>${s.frete===0?'Grátis':fmt(s.frete)}</span></div>
    <div class="rowline tot"><span>Total</span><span>${fmt(s.total)}</span></div>
  </div>
  <button class="btn primary block" data-go="checkout">Fechar pedido</button>`;
}

function renderCheckout(){
  const s = cartSummary();
  const decline = state.checkoutDeclined;
  if(decline){
    return `
    <div class="back" data-go="cart" tabindex="0" role="button">← Voltar ao carrinho</div>
    <div class="alert">✕ <span><b>Pagamento recusado</b> pelo seu banco. Nenhum valor foi cobrado, e seu carrinho e suas personalizações continuam salvos — nada foi perdido.</span></div>
    <div class="label">Pagamento</div>
    <div class="field">Cartão terminado em 4471</div>
    <button class="btn primary block" data-retrycard="1">Tentar outro cartão</button>
    <button class="btn block" data-paypix="1">Pagar com Pix</button>`;
  }
  return `
  <div class="back" data-go="cart" tabindex="0" role="button">← Voltar ao carrinho</div>
  <h2>Fechar pedido</h2>
  <div class="alert ok">✓ <span>Confirmamos entrega até <b>${fmtDate(s.arrival)}</b>.</span></div>
  <div>
    <div class="label" style="margin-bottom:6px">Endereço de entrega</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <input class="field" placeholder="Nome completo" value="Marina Souza">
      <input class="field" placeholder="CEP, rua, número">
      <input class="field" placeholder="Cidade / UF">
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Observação de entrega (opcional)</div>
    <textarea class="field" id="deliveryNote" placeholder="Ex: entregar com o vizinho, portão azul, apto 302..."></textarea>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Pagamento</div>
    <input class="field" id="cardNumber" placeholder="Número do cartão" inputmode="numeric">
  </div>
  <button class="btn primary block" data-confirmorder="1">Confirmar pedido</button>`;
}

function renderConfirmation(){
  const o = state.lastOrder;
  if(!o) return renderHome();
  return `
  <div class="empty" style="padding-top:6px">
    <div class="icon64" style="background:var(--success-bg);color:var(--success)">✓</div>
    <h3>Pedido confirmado!</h3>
    <div style="font-size:12px;color:var(--muted)">Pedido #${o.id}</div>
  </div>
  <div class="alert ok">✓ <span>Entrega confirmada até <b>${fmtDate(o.arrival)}</b>.</span></div>
  <div class="card">
    <div class="label" style="margin-bottom:6px">Resumo</div>
    ${o.items.map(i=>`<div class="rowline"><span>${i.name}</span><span>${fmt(i.price)}</span></div>`).join('')}
    <div class="rowline tot"><span>Total</span><span>${fmt(o.total)}</span></div>
  </div>
  <button class="btn primary block" data-go="account" data-accounttab="pedidos">Acompanhar pedido</button>`;
}

function stepLabels(){ return ['Recebido','Em produção','Enviado','Entregue']; }
function renderStepper(status){
  const labels = stepLabels();
  let html = '<div class="stepper">';
  for(let i=0;i<4;i++){
    html += `<div class="dot ${i<status?'done':''}"></div>`;
    if(i<3) html += `<div class="ln ${i<status-1?'done':''}"></div>`;
  }
  html += '</div><div class="steplabels">' + labels.map(l=>`<span>${l}</span>`).join('') + '</div>';
  return html;
}

function renderAccount(){
  const tabs = [['pedidos','Pedidos'],['favoritos','Favoritos'],['dados','Dados']];
  let body = '';
  if(state.accountTab==='pedidos'){
    body = state.orders.length ? state.orders.map(o=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600">
          <span>Pedido #${o.id}</span><span style="color:var(--muted);font-weight:400">${o.date}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${o.items}</div>
        ${renderStepper(o.status)}
      </div>`).join('') : `<div style="font-size:12px;color:var(--muted)">Você ainda não fez nenhum pedido.</div>`;
  } else if(state.accountTab==='favoritos'){
    const favs = PRODUCTS.filter(p=>state.favorites.has(p.id));
    body = favs.length ? `<div class="grid2">${favs.map(p=>`
      <div class="card" style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between">${imgph(p.img, p.icon, 'width:40px;height:40px;font-size:16px;')}<span class="heart" data-favtoggle="${p.id}" tabindex="0" role="button" aria-pressed="true" aria-label="Remover ${p.name} dos favoritos">♥</span></div>
        <div style="font-size:11.5px;font-weight:500;cursor:pointer" data-product="${p.id}" tabindex="0" role="button" aria-label="${p.name}">${p.name}</div>
        <div class="price" style="font-size:11px">${fmt(p.price)}</div>
      </div>`).join('')}</div>` : `<div style="font-size:12px;color:var(--muted)">Nenhum favorito ainda.</div>`;
  } else {
    body = `
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div><div class="label">Nome</div><div style="font-size:13px;margin-top:2px">Marina Souza</div></div>
      <div><div class="label">E-mail</div><div style="font-size:13px;margin-top:2px">marina.souza@email.com</div></div>
      <div><div class="label">Telefone</div><div style="font-size:13px;margin-top:2px">(11) 98888-2231</div></div>
    </div>`;
  }
  return `
  <h2>Minha conta</h2>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<div class="tab ${state.accountTab===k?'on':''}" data-accounttab="${k}" tabindex="0" role="tab" aria-selected="${state.accountTab===k}">${l}</div>`).join('')}</div>
  ${body}`;
}

function renderInstitutional(){
  const faqs = [
    ['Como funciona a personalização?','Você escolhe o produto, escreve o texto ou nome, define tipografia e cores, e acompanha uma prévia ao vivo antes de finalizar a compra.'],
    ['Posso trocar um item personalizado?','Sim, em até 7 dias após o recebimento, desde que o produto não tenha sido usado. Itens com erro de fabricação são trocados sem custo.'],
    ['E se eu errar o prazo do evento?','A plataforma avisa antes da compra se o prazo de produção não cabe na sua data, sugerindo produtos com entrega expressa ou outra data.'],
  ];
  return `
  <h2>Institucional</h2>
  <div class="label">Prazo de produção por categoria</div>
  <div class="table">
    <div class="row"><span>Cadernos/Agendas</span><span style="font-weight:600">2 dias úteis</span></div>
    <div class="row"><span>Cartões</span><span style="font-weight:600">3 dias úteis</span></div>
    <div class="row"><span>Convites</span><span style="font-weight:600">4 dias úteis</span></div>
    <div class="row"><span>Kits de presente</span><span style="font-weight:600">3 dias úteis</span></div>
    <div class="row"><span>Canecas/Blocos/Canetas</span><span style="font-weight:600">2 dias úteis</span></div>
  </div>
  <div class="label">Perguntas frequentes</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    ${faqs.map(([q,a],i)=>`
      <div class="acc">
        <div class="q" data-faq="${i}" tabindex="0" role="button" aria-expanded="${state.openFaq===i}">${q}<span>${state.openFaq===i?'−':'+'}</span></div>
        ${state.openFaq===i?`<div class="a">${a}</div>`:''}
      </div>`).join('')}
  </div>
  <div class="label">Política de troca/cancelamento</div>
  <div class="acc">
    <div class="q" data-politica="1" tabindex="0" role="button" aria-expanded="${state.openPolitica}">Ver política completa<span>${state.openPolitica?'−':'→'}</span></div>
    ${state.openPolitica?`<div class="a">Peças personalizadas podem ser trocadas em até 7 dias por defeito de fabricação. Pedidos ainda não enviados à produção podem ser cancelados com reembolso integral; após o início da produção, aplicamos uma taxa de 20% sobre o valor do item.</div>`:''}
  </div>`;
}

function render(){
  let body = '';
  switch(state.view){
    case 'home': body = renderHome(); break;
    case 'catalog': body = renderCatalog(); break;
    case 'product': body = renderProduct(); break;
    case 'personalize': body = renderPersonalize(); break;
    case 'cart': body = renderCart(); break;
    case 'checkout': body = renderCheckout(); break;
    case 'confirmation': body = renderConfirmation(); break;
    case 'account': body = renderAccount(); break;
    case 'institutional': body = renderInstitutional(); break;
    default: body = renderHome();
  }
  document.getElementById('app').innerHTML = renderTopbar() + `<main>${body}</main>` + renderFooter();
  bindInputs();
}

function bindInputs(){
  const si = document.getElementById('searchInput');
  if(si){
    si.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ state.query = si.value.trim(); nav('catalog'); }
    });
    si.addEventListener('blur', ()=>{ state.query = si.value.trim(); });
  }
  const dt = document.getElementById('draftText');
  if(dt){
    dt.addEventListener('input', ()=>{
      const p = productById(state.currentProductId);
      p.draft.text = dt.value;
      render();
      const el = document.getElementById('draftText');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  const dd = document.getElementById('draftDate');
  if(dd){
    const onDateChange = ()=>{
      const p = productById(state.currentProductId);
      p.draft.eventDate = dd.value;
      render();
    };
    dd.addEventListener('input', onDateChange);
    dd.addEventListener('change', onDateChange);
  }
}

document.getElementById('app').addEventListener('keydown', e=>{
  if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
  const el = e.target.closest('[role="button"],[role="link"],[role="checkbox"],[role="radio"],[role="tab"]');
  if(!el) return;
  e.preventDefault();
  el.click();
});

document.getElementById('app').addEventListener('click', e=>{
  const t = e.target;
  const go = t.closest('[data-go]');
  const cat = t.closest('[data-cat]');
  const product = t.closest('[data-product]');
  const personalize = t.closest('[data-personalize]');
  const addplain = t.closest('[data-addplain]');
  const addpersonalized = t.closest('[data-addpersonalized]');
  const togglecat = t.closest('[data-togglecat]');
  const toggleprazo = t.closest('[data-toggleprazo]');
  const clearsearch = t.closest('[data-clearsearch]');
  const typo = t.closest('[data-typo]');
  const paper = t.closest('[data-paper]');
  const ink = t.closest('[data-ink]');
  const cleardate = t.closest('[data-cleardate]');
  const removecart = t.closest('[data-removecart]');
  const confirmorder = t.closest('[data-confirmorder]');
  const retrycard = t.closest('[data-retrycard]');
  const paypix = t.closest('[data-paypix]');
  const accounttab = t.closest('[data-accounttab]');
  const favtoggle = t.closest('[data-favtoggle]');
  const faq = t.closest('[data-faq]');
  const politica = t.closest('[data-politica]');

  if(go){
    if(go.dataset.accounttab) state.accountTab = go.dataset.accounttab;
    nav(go.dataset.go);
    return;
  }
  if(cat){ state.catFilter = new Set([cat.dataset.cat]); nav('catalog'); return; }
  if(product){ state.currentProductId = product.dataset.product; nav('product'); return; }
  if(personalize){
    const p = productById(personalize.dataset.personalize);
    p.draft = newDraft();
    state.currentProductId = p.id;
    nav('personalize');
    return;
  }
  if(addplain){
    const p = productById(addplain.dataset.addplain);
    state.cart.push({name:p.name, icon:p.icon, img:p.img, price:p.price, lead:p.lead, sub:'Sem personalização'});
    nav('cart');
    return;
  }
  if(addpersonalized){
    if(addpersonalized.hasAttribute('disabled')) return;
    const p = productById(addpersonalized.dataset.addpersonalized);
    const d = p.draft;
    const sub = p.personal.type==='mensagem' ? `"${d.text}"` : d.text;
    state.cart.push({name:p.name, icon:p.icon, img:p.img, price:p.price, lead:p.lead, sub: sub + ' · ' + TYPO.find(t=>t.k===d.typography).label});
    p.draft = null;
    nav('cart');
    return;
  }
  if(togglecat){
    const k = togglecat.dataset.togglecat;
    if(state.catFilter.has(k)) state.catFilter.delete(k); else state.catFilter.add(k);
    render();
    return;
  }
  if(toggleprazo){
    const d = Number(toggleprazo.dataset.toggleprazo);
    if(state.prazoFilter.has(d)) state.prazoFilter.delete(d); else state.prazoFilter.add(d);
    render();
    return;
  }
  if(clearsearch){ state.query=''; render(); return; }
  if(typo){ productById(state.currentProductId).draft.typography = typo.dataset.typo; render(); return; }
  if(paper){ productById(state.currentProductId).draft.paperColor = paper.dataset.paper; render(); return; }
  if(ink){ productById(state.currentProductId).draft.inkColor = ink.dataset.ink; render(); return; }
  if(cleardate){ productById(state.currentProductId).draft.eventDate=''; render(); return; }
  if(removecart){ state.cart.splice(Number(removecart.dataset.removecart),1); render(); return; }
  if(confirmorder){
    const cardEl = document.getElementById('cardNumber');
    const card = (cardEl ? cardEl.value : '').replace(/\s/g,'');
    if(card.endsWith('4471')){
      state.checkoutDeclined = true;
      render();
      return;
    }
    const s = cartSummary();
    const id = String(Math.floor(40000+Math.random()*9000));
    state.lastOrder = {id, items: state.cart.map(i=>({name:i.name, price:i.price})), total: s.total, arrival: s.arrival};
    state.orders.unshift({id, items: state.cart.map(i=>i.name).join(', '), status:1, date: fmtDate(new Date())});
    state.cart = [];
    state.checkoutDeclined = false;
    nav('confirmation');
    return;
  }
  if(retrycard){ state.checkoutDeclined=false; render(); return; }
  if(paypix){
    const s = cartSummary();
    const id = String(Math.floor(40000+Math.random()*9000));
    state.lastOrder = {id, items: state.cart.map(i=>({name:i.name, price:i.price})), total: s.total, arrival: s.arrival};
    state.orders.unshift({id, items: state.cart.map(i=>i.name).join(', '), status:1, date: fmtDate(new Date())});
    state.cart = [];
    state.checkoutDeclined = false;
    nav('confirmation');
    return;
  }
  if(accounttab){ state.accountTab = accounttab.dataset.accounttab; render(); return; }
  if(favtoggle){
    const id = favtoggle.dataset.favtoggle;
    if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
    render();
    return;
  }
  if(faq){ const i = Number(faq.dataset.faq); state.openFaq = state.openFaq===i ? null : i; render(); return; }
  if(politica){ state.openPolitica = !state.openPolitica; render(); return; }
});

render();
</script>
</body>
</html>
